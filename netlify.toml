# Netlify Edge & Next.js Performance Configuration

[[headers]]
  for = "/*.(mp4|webm|webp|png|jpg|jpeg|svg|ico|woff|woff2|avif)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
