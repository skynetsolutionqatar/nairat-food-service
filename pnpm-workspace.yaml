allowBuilds:
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Security patches for transitive dependencies (same major only).
# Remove an entry once its parent package ships the fixed version.
overrides:
  dompurify@3: ^3.4.17
  undici@7: ^7.30.1
  zod@4: ^4.6.6
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  smol-toml@1: ^1.8.1
  source-map-js@1: ^1.2.2
  prismjs@1: ^1.30.0
